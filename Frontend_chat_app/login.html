<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chào mừng trở lại · Rinchat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/config.js"></script>
    <script type="module" src="/js/login.js"></script>
</head>

<body class="auth-page"><a class="brand auth-brand" href="/login.html"><span class="brand-mark">R</span>Rinchat</a>
    <main class="auth-layout">
        <section class="auth-intro">
            <p class="eyebrow">RẤT VUI ĐƯỢC GẶP LẠI</p>
            <h1>Những cuộc trò chuyện<br>luôn khiến bạn muốn<br><span>quay trở lại.</span></h1>
            <p>Bạn bè luôn ở ngay bên kia tin nhắn.</p>
            <div class="decorative-dots" aria-hidden="true">········</div>
        </section>
        <section class="auth-card panel">
            <p class="eyebrow">GÓC TRÒ CHUYỆN ĐANG CHỜ BẠN</p>
            <h2>Chào mừng trở lại</h2>
            <p class="muted">Đăng nhập để tiếp tục trò chuyện.</p>
            <form data-login-form novalidate><label for="identifier">Email hoặc tên tài khoản</label><input id="identifier"
                    name="identifier" autocomplete="username" placeholder="you@example.com" required><label
                    for="password">Mật khẩu</label><input id="password" name="password" type="password"
                    autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                <p class="form-error" data-error role="alert" aria-live="polite"></p><button
                    class="button button-primary button-full" type="submit"><span data-button-label>Đăng nhập</span><span
                        aria-hidden="true">→</span></button>
            </form>
            <p class="auth-switch">Bạn mới dùng Rinchat? <a href="/register.html">Tạo tài khoản</a></p>
        </section>
    </main>
    <footer class="auth-footer">Nơi những cuộc trò chuyện ý nghĩa bắt đầu.</footer>
</body>

</html>

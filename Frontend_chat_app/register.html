<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo tài khoản · Rinchat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/config.js"></script>
    <script type="module" src="/js/register.js"></script>
</head>

<body class="auth-page"><a class="brand auth-brand" href="/login.html"><span class="brand-mark">R</span>Rinchat</a>
    <main class="auth-layout register-layout">
        <section class="auth-intro">
            <p class="eyebrow">LỜI CHÀO MỚI BẮT ĐẦU TỪ ĐÂY</p>
            <h1>Dành chỗ<br>cho những cuộc<br><span>trò chuyện hay.</span></h1>
            <p>Kết nối gần hơn với những người bạn yêu quý.</p>
            <div class="decorative-dots" aria-hidden="true">········</div>
        </section>
        <section class="auth-card panel">
            <p class="eyebrow">CÙNG BẮT ĐẦU TRÒ CHUYỆN</p>
            <h2>Tạo tài khoản của bạn</h2>
            <p class="muted">Chỉ mất một phút để bắt đầu.</p>
            <form data-register-form novalidate>
                <div class="form-row">
                    <div><label for="username">Tên tài khoản</label><input id="username" name="username"
                            autocomplete="username" placeholder="nguyen_an" required></div>
                    <div><label for="displayName">Tên hiển thị</label><input id="displayName" name="displayName"
                            autocomplete="name" placeholder="Nguyễn An" required></div>
                </div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"
                    placeholder="you@example.com" required>
                <div class="form-row">
                    <div><label for="newPassword">Mật khẩu</label><input id="newPassword" name="password"
                            type="password" autocomplete="new-password" minlength="8"
                            placeholder="Ít nhất 8 ký tự" required></div>
                    <div><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword"
                            name="confirmPassword" type="password" autocomplete="new-password"
                            placeholder="Nhập lại mật khẩu" required></div>
                </div>
                <p class="form-error" data-error role="alert" aria-live="polite"></p><button
                    class="button button-primary button-full" type="submit"><span data-button-label>Tạo
                        tài khoản</span><span aria-hidden="true">→</span></button>
            </form>
            <p class="auth-switch">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
        </section>
    </main>
    <footer class="auth-footer">Nơi những cuộc trò chuyện ý nghĩa bắt đầu.</footer>
</body>

</html>

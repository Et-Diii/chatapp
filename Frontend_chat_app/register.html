<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · ChatApp</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/config.js"></script>
    <script type="module" src="/js/register.js"></script>
</head>

<body class="auth-page"><a class="brand auth-brand" href="/login.html"><span class="brand-mark">C</span>ChatApp</a>
    <main class="auth-layout register-layout">
        <section class="auth-intro">
            <p class="eyebrow">YOUR NEXT HELLO STARTS HERE</p>
            <h1>Make room<br>for <span>good</span><br>conversations.</h1>
            <p>Bring your favorite people a little closer.</p>
            <div class="decorative-dots" aria-hidden="true">········</div>
        </section>
        <section class="auth-card panel">
            <p class="eyebrow">JOIN THE CONVERSATION</p>
            <h2>Create your account</h2>
            <p class="muted">It only takes a moment to get started.</p>
            <form data-register-form novalidate>
                <div class="form-row">
                    <div><label for="username">Username</label><input id="username" name="username"
                            autocomplete="username" placeholder="jane_smith" required></div>
                    <div><label for="displayName">Display name</label><input id="displayName" name="displayName"
                            autocomplete="name" placeholder="Jane Smith" required></div>
                </div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"
                    placeholder="you@example.com" required>
                <div class="form-row">
                    <div><label for="newPassword">Password</label><input id="newPassword" name="password"
                            type="password" autocomplete="new-password" minlength="8"
                            placeholder="At least 8 characters" required></div>
                    <div><label for="confirmPassword">Confirm password</label><input id="confirmPassword"
                            name="confirmPassword" type="password" autocomplete="new-password"
                            placeholder="Repeat password" required></div>
                </div>
                <p class="form-error" data-error role="alert" aria-live="polite"></p><button
                    class="button button-primary button-full" type="submit"><span data-button-label>Create
                        account</span><span aria-hidden="true">→</span></button>
            </form>
            <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
        </section>
    </main>
    <footer class="auth-footer">Made for the conversations that matter.</footer>
</body>

</html>

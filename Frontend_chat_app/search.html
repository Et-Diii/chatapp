<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khám phá · Rinchat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/friends.css">
    <link rel="stylesheet" href="/css/search.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js" defer></script>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/search.js"></script>
</head>

<body class="app-shell">
    <header class="topbar"><a class="brand" href="/index.html"><span class="brand-mark">R</span>Rinchat</a>
        <nav class="topnav" aria-label="Điều hướng chính"><a href="/index.html">Tin nhắn</a><a
                href="/friends.html">Bạn bè</a><a class="active" href="/search.html">Khám phá</a></nav>
        <div class="top-actions"><a class="profile-link" href="/profile.html"><img class="avatar avatar-sm"
                    data-current-avatar alt=""><span data-current-name>Hồ sơ của tôi</span></a><button
                class="button button-quiet" data-logout>Đăng xuất</button></div>
    </header>
    <main class="page-wrap">
        <div class="page-heading">
            <div>
                <p class="eyebrow">KẾT NỐI MỚI</p>
                <h1>Tìm bạn bè</h1>
                <p class="muted">Một cuộc trò chuyện hay có thể bắt đầu từ đây.</p>
            </div>
        </div>
        <section class="panel content-panel discover-panel">
            <form class="discover-search" data-search-form><label class="sr-only" for="keyword">Tìm theo tên hoặc
                    tên tài khoản</label><span aria-hidden="true">⌕</span><input id="keyword" name="keyword" type="search"
                    placeholder="Tìm theo tên hoặc tên tài khoản…" autocomplete="off"><button class="button button-primary"
                    type="submit">Tìm kiếm</button></form>
            <div class="search-meta">
                <p data-search-message class="muted">Tìm ai đó bằng tên hoặc tên tài khoản.</p>
            </div>
            <div data-results class="people-grid"></div>
        </section>
    </main>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Friends · ChatApp</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/friends.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js" defer></script>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/friends.js"></script>
</head>

<body class="app-shell">
    <header class="topbar"><a class="brand" href="/index.html"><span class="brand-mark">C</span>ChatApp</a>
        <nav class="topnav" aria-label="Main navigation"><a href="/index.html">Messages</a><a class="active"
                href="/friends.html">Friends</a><a href="/search.html">Discover</a></nav>
        <div class="top-actions"><a class="profile-link" href="/profile.html"><img class="avatar avatar-sm"
                    data-current-avatar alt=""><span data-current-name>My profile</span></a><button
                class="button button-quiet" data-logout>Log out</button></div>
    </header>
    <main class="page-wrap">
        <div class="page-heading">
            <div>
                <p class="eyebrow">YOUR PEOPLE</p>
                <h1>Friends</h1>
                <p class="muted">Keep up with the people who make your day.</p>
            </div><a class="button button-primary" href="/search.html">＋ Find people</a>
        </div>
        <section id="requests" class="panel content-panel">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">INVITATIONS</p>
                    <h2>Friend requests</h2>
                </div>
            </div>
            <div class="request-columns">
                <div>
                    <h3>Received <span class="count-pill" data-received-count>0</span></h3>
                    <div data-received-requests class="people-list">
                        <p class="muted">Loading requests…</p>
                    </div>
                </div>
                <div>
                    <h3>Sent</h3>
                    <div data-sent-requests class="people-list">
                        <p class="muted">Loading requests…</p>
                    </div>
                </div>
            </div>
        </section>
        <section class="panel content-panel">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR CIRCLE</p>
                    <h2>All friends <span class="count-pill" data-friend-count>0</span></h2>
                </div><a class="text-link" href="/search.html">Discover people →</a>
            </div>
            <div data-friends class="people-grid">
                <p class="muted">Loading friends…</p>
            </div>
        </section>
    </main>
</body>

</html>
